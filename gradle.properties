# Memoria moderada: la maquina tiene 11 GB y 8 nucleos.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Android
android.useAndroidX=true

# Compilador Kotlin dentro del daemon de Gradle: evita un segundo JVM (menos RAM con varios builds a la vez)
kotlin.compiler.execution.strategy=in-process
